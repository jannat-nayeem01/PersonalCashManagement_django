{% extends 'base.html' %}
{%block content%}
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h2>Add Cash</h2>
                <form method='POST'>
                    {% csrf_token %}
                    <input type='hidden' name='form_type' value='cash'>
                    {{cash_form.as_p}}
                    <button type='submit' class='btn btn-primary w-100'>Add Cash</button>
                </form>
            </div>

            <div class="col-md-6">
                <h2>Add Expense</h2>
                <form method='POST'>
                    {% csrf_token %}
                    <input type='hidden' name='form_type' value='expense'>
                    {{expense_form.as_p}}
                    <button type='submit' class='btn btn-danger w-100'>Add Expense</button>
                </form>
            </div>
        </div>
        {%endblock%}
